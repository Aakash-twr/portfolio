    <!--
      Fonts: preconnect first so the CSS request and the font files it triggers do
      not each pay a fresh connection. `display=swap` keeps first paint unblocked.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <!--
      Theme bootstrap. Runs before first paint so a returning visitor who chose
      light mode never sees a dark flash. Dark is the default.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.dataset.theme = stored;
          }
        } catch (e) {
          /* private mode — keep the dark default */
        }
      })();
    </script>
